<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Usuarios · Sistema de Estudio</title>
<script src="vendor/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; min-height: 100vh; color: #1a1a2e; }

  header { background: #1a1a2e; color: #fff; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  header h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: 0.5px; flex: 1; }
  header span.logo { font-size: 1.5rem; }

  .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 0.75rem; flex-wrap: wrap; }
  .top-bar h2 { font-size: 1.1rem; font-weight: 600; color: #1a1a2e; }
  .top-bar-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1.1rem; border-radius: 8px; border: none; cursor: pointer; font-size: 0.875rem; font-weight: 500; transition: all 0.15s; }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover { background: #4338ca; }
  .btn-ghost { background: transparent; border: 1.5px solid #d1d5db; color: #374151; }
  .btn-ghost:hover { background: #f3f4f6; }
  .btn-success { background: #059669; color: #fff; }
  .btn-success:hover { background: #047857; }
  .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }

  .search-row { margin-bottom: 1.25rem; }
  .search-input { width: 100%; max-width: 340px; padding: 0.55rem 0.8rem; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 0.88rem; outline: none; background: #fff; }
  .search-input:focus { border-color: #4f46e5; }

  .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.1rem; }

  .user-card { background: #fff; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); overflow: hidden; transition: box-shadow 0.15s, transform 0.15s; position: relative; }
  .user-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.12); transform: translateY(-2px); }
  .user-card--selected { outline: 2px solid #4f46e5; }
  .user-selected-badge { position: absolute; top: 8px; right: 8px; background: #4f46e5; color: #fff; font-size: 0.68rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .user-body { padding: 1.1rem 1.1rem 0.85rem; display: flex; align-items: center; gap: 0.9rem; }
  .user-qr-thumb { width: 62px; height: 62px; border-radius: 10px; background: #fff; border: 1.5px solid #e5e7eb; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; overflow: hidden; }
  .user-qr-thumb img, .user-qr-thumb canvas { width: 100%; height: 100%; }
  .user-name { font-weight: 600; font-size: 1rem; word-break: break-word; }
  .user-code { font-size: 0.78rem; color: #6b7280; margin-top: 3px; font-family: 'Courier New', monospace; letter-spacing: 0.03em; }
  .user-card-footer { padding: 0.6rem 1.1rem; border-top: 1px solid #f3f4f6; display: flex; justify-content: flex-end; gap: 0.4rem; }

  .empty-state { text-align: center; padding: 3rem 1rem; color: #9ca3af; }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
  .empty-state p { font-size: 0.95rem; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 1.75rem; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
  .modal h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 1.25rem; }
  .modal label { display: block; font-size: 0.85rem; color: #374151; margin-bottom: 0.35rem; font-weight: 500; }
  .modal input { width: 100%; padding: 0.55rem 0.75rem; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 0.9rem; outline: none; transition: border 0.15s; }
  .modal input:focus { border-color: #4f46e5; }
  .modal .form-group { margin-bottom: 1rem; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.25rem; }
  .code-row { display: flex; gap: 0.5rem; }
  .code-row input { flex: 1; }
  .code-gen-btn { padding: 0.5rem 0.7rem; border-radius: 8px; border: 1.5px solid #c7d2fe; background: #eef2ff; color: #4338ca; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .code-gen-btn:hover { background: #e0e7ff; }

  /* Modal ver QR grande */
  .qr-view-box { text-align: center; }
  .qr-view-box .qr-big { display: flex; justify-content: center; margin: 0.5rem 0 1rem; }
  .qr-view-name { font-weight: 600; font-size: 1.05rem; }
  .qr-view-code { font-size: 0.82rem; color: #6b7280; font-family: 'Courier New', monospace; margin-top: 2px; margin-bottom: 0.75rem; }

  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1a1a2e; color: #fff; padding: 0.75rem 1.25rem; border-radius: 10px; font-size: 0.875rem; opacity: 0; transform: translateY(10px); transition: all 0.25s; pointer-events: none; z-index: 200; max-width: 300px; }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
  <script src="_nav.js"></script>
  <script src="cordova.js" onerror="void 0"></script>
  <script src="_share.js" onerror="void 0"></script>
</head>
<body>

<header>
  <span class="logo">👤</span>
  <h1>Usuarios</h1>
</header>

<div class="container">
  <div class="top-bar">
    <h2>Lista de Usuarios</h2>
    <div class="top-bar-actions">
      <button class="btn btn-primary" onclick="openNewUser()">+ Nuevo Usuario</button>
    </div>
  </div>

  <div class="search-row">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar por nombre o código…" oninput="render()">
  </div>

  <div class="users-grid" id="usersGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="icon">👤</div>
    <p>No tienes usuarios todavía.<br>Crea uno para comenzar.</p>
  </div>
</div>

<!-- Modal Nuevo/Editar Usuario -->
<div class="modal-overlay" id="modalUser">
  <div class="modal">
    <h3 id="modalUserTitle">Nuevo Usuario</h3>
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" id="inputUserName" placeholder="Ej: Juan Pérez">
    </div>
    <div class="form-group">
      <label>Código</label>
      <div class="code-row">
        <input type="text" id="inputUserCode" placeholder="Ej: U-0001">
        <button type="button" class="code-gen-btn" onclick="generateCode()">🎲 Generar</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modalUser')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveUser()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal Ver QR -->
<div class="modal-overlay" id="modalViewQr">
  <div class="modal">
    <div class="qr-view-box">
      <div class="qr-big" id="qrBigHolder"></div>
      <div class="qr-view-name" id="qrViewName"></div>
      <div class="qr-view-code" id="qrViewCode"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modalViewQr')">Cerrar</button>
      <button class="btn btn-primary" onclick="downloadCurrentQr()">⬇️ Descargar QR</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let users = JSON.parse(localStorage.getItem('app_usuarios') || '[]');
let editingUserId = null;
let currentQrUser = null;

function save() { localStorage.setItem('app_usuarios', JSON.stringify(users)); }

function render() {
  const grid = document.getElementById('usersGrid');
  const empty = document.getElementById('emptyState');
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const filtered = users.filter(u =>
    !q || u.nombre.toLowerCase().includes(q) || u.codigo.toLowerCase().includes(q)
  );
  grid.innerHTML = '';
  if (!users.length) {
    empty.style.display = 'block';
    empty.querySelector('p').innerHTML = 'No tienes usuarios todavía.<br>Crea uno para comenzar.';
    return;
  }
  if (!filtered.length) {
    empty.style.display = 'block';
    empty.querySelector('p').innerHTML = 'No se encontraron usuarios.';
    return;
  }
  empty.style.display = 'none';
  const selectedUserId = localStorage.getItem('app_usuario_seleccionado_id');
  filtered.forEach(u => {
    const card = document.createElement('div');
    const isSelected = u.id === selectedUserId;
    card.className = 'user-card' + (isSelected ? ' user-card--selected' : '');
    const thumbId = 'thumb_' + u.id;
    card.innerHTML = `
      ${isSelected ? '<span class="user-selected-badge">Seleccionado</span>' : ''}
      <div class="user-body">
        <div class="user-qr-thumb" id="${thumbId}" onclick="viewQr('${u.id}')"></div>
        <div>
          <div class="user-name">${escH(u.nombre)}</div>
          <div class="user-code">${escH(u.codigo)}</div>
        </div>
      </div>
      <div class="user-card-footer">
        <button class="btn btn-ghost btn-sm" onclick="viewQr('${u.id}')">🔲 QR</button>
        <button class="btn btn-ghost btn-sm" onclick="openEditUser('${u.id}')">✏️</button>
        <button class="btn btn-ghost btn-sm" onclick="deleteUser('${u.id}')">🗑️</button>
      </div>
    `;
    grid.appendChild(card);
    renderQrInto(thumbId, u.codigo, 62);
  });
}

// ── Generación de QR a partir del código ─────────────────────────
function renderQrInto(holderId, text, size) {
  const holder = document.getElementById(holderId);
  if (!holder) return;
  holder.innerHTML = '';
  if (typeof QRCode === 'undefined' || !text) { holder.textContent = '⚠️'; return; }
  new QRCode(holder, {
    text: text, width: size, height: size,
    colorDark: '#1a1a2e', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
}

function viewQr(id) {
  const u = users.find(x => x.id === id);
  if (!u) return;
  currentQrUser = u;
  document.getElementById('qrViewName').textContent = u.nombre;
  document.getElementById('qrViewCode').textContent = u.codigo;
  renderQrInto('qrBigHolder', u.codigo, 220);
  openModal('modalViewQr');
}

function downloadCurrentQr() {
  if (!currentQrUser) return;
  const holder = document.getElementById('qrBigHolder');
  const canvas = holder.querySelector('canvas');
  const img = holder.querySelector('img');
  const src = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
  if (!src) { showToast('⚠️ No se pudo generar la imagen del QR'); return; }
  const a = document.createElement('a');
  a.href = src;
  a.download = `QR_${currentQrUser.codigo}.png`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// ── CRUD de usuarios ──────────────────────────────────────────────
function openNewUser() {
  editingUserId = null;
  document.getElementById('inputUserName').value = '';
  document.getElementById('inputUserCode').value = '';
  document.getElementById('modalUserTitle').textContent = 'Nuevo Usuario';
  openModal('modalUser');
}
function openEditUser(id) {
  const u = users.find(x => x.id === id);
  if (!u) return;
  editingUserId = id;
  document.getElementById('inputUserName').value = u.nombre;
  document.getElementById('inputUserCode').value = u.codigo;
  document.getElementById('modalUserTitle').textContent = 'Editar Usuario';
  openModal('modalUser');
}
function generateCode() {
  const rand = Math.random().toString(36).slice(2, 8).toUpperCase();
  document.getElementById('inputUserCode').value = `U-${rand}`;
}
function saveUser() {
  const nombre = document.getElementById('inputUserName').value.trim();
  const codigo = document.getElementById('inputUserCode').value.trim();
  if (!nombre) return alert('Escribe un nombre para el usuario.');
  if (!codigo) return alert('Escribe o genera un código para el usuario.');
  const dupe = users.find(x => x.codigo.toLowerCase() === codigo.toLowerCase() && x.id !== editingUserId);
  if (dupe) return alert('Ya existe un usuario con ese código.');
  if (editingUserId) {
    const u = users.find(x => x.id === editingUserId);
    u.nombre = nombre; u.codigo = codigo;
  } else {
    users.push({ id: Date.now().toString() + Math.random().toString(36).slice(2,6), nombre, codigo });
  }
  save(); render(); closeModal('modalUser');
  showToast('✅ Usuario guardado');
}
function deleteUser(id) {
  if (!confirm('¿Eliminar este usuario?')) return;
  users = users.filter(u => u.id !== id);
  save(); render();
  showToast('🗑️ Usuario eliminado');
}

// ── Helpers ───────────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));

render();
</script>
</body>
</html>
